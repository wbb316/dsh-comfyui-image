# 想改 ComfyUI 地址 / 默认模型等，不必改这里：直接改
#   ~/.dsh-comfyui-image/config.json
# 或者在 profile 的 cordis.patch.yml 里给这条 entry 加 config：
#   - id: dsh-comfyui-image
